# 抖音旧接口广告清理实验 — 2026-10-11
# 原始模块标注抖音 <=16.2.0；未在用户当前 iPhone / 最新抖音实测。
# 仅处理可解密的旧版 JSON feed，移除明确广告项。
# 不包含：隐藏原生“＋”、免广告权益卡、广告奖励、未成年模式修改。
# 如果启用后抖音无法加载，请关闭此独立资源；它不绕过证书校验。
# 在圈 X 脚本日志搜索“QX抖音实验”可判断脚本是否执行；日志不含账户或请求参数。
# 独立资源避免将实验性的抖音 MitM 域名并入稳定综合重写。

^https:\/\/(?:api[a-z0-9-]*\.amemv\.com|aweme\.snssdk\.com)\/aweme\/v[12]\/(?:feed|follow\/feed|nearby\/feed)\/(?:\?[^#]*)?$ url script-response-body https://raw.githubusercontent.com/woziji159/Quantunmult/main/qx-douyin-feed-experimental.js

hostname = api*.amemv.com, aweme.snssdk.com
