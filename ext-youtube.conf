#[rewrite_local]
^https:\/\/dualsubs\.github\.io\/api\/YouTube(?:\?.*)?$ url echo-response application/json\r\nX-PreferencePanes-Version: 1.6.0 echo-response https://raw.githubusercontent.com/woziji159/Quantunmult/refs/heads/main/ext-subs-youtube-dualsubs.youtube.preferencepanes.json
^https?:\/\/([\w-]+)\.googlevideo\.com\/initplayback(\?.*oad=.+)$ url reject-dict

#[Script]
# YouTube
# 🍿️ DualSubs.YouTube.Player.request.json
^https?:\/\/(www|m|tv)\.youtube\.com\/youtubei\/v1\/player(\?.+)?$ url script-request-body https://raw.githubusercontent.com/woziji159/Quantunmult/refs/heads/main/ext-subs-youtube-request.js
# 🍿️ DualSubs.YouTube.Player.response.json
^https?:\/\/(www|m|tv)\.youtube\.com\/youtubei\/v1\/player(\?.+)?$ url script-response-body https://raw.githubusercontent.com/woziji159/Quantunmult/refs/heads/main/ext-youtube-combined-response.js
# 🍿️ DualSubs.YouTube.Player.request.proto
^https?:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/player(\?.+)?$ url script-request-body https://raw.githubusercontent.com/woziji159/Quantunmult/refs/heads/main/ext-subs-youtube-request.js
# 🍿️ DualSubs.YouTube.Player.response.proto
^https?:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/player(\?.+)?$ url script-response-body https://raw.githubusercontent.com/woziji159/Quantunmult/refs/heads/main/ext-youtube-combined-response.js
# 🍿️ DualSubs.YouTube.GetWatch.response.proto
^https?:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/get_watch(\?.+)?$ url script-response-body https://raw.githubusercontent.com/woziji159/Quantunmult/refs/heads/main/ext-youtube-combined-response.js
# 🍿️ DualSubs.YouTube.TimedText.request
^https?:\/\/(www|m)\.youtube\.com\/api\/timedtext url script-request-header https://raw.githubusercontent.com/woziji159/Quantunmult/refs/heads/main/ext-subs-youtube-request.js
# 🍿️ DualSubs.YouTube.Composite.TimedText.response
^https?:\/\/(www|m)\.youtube\.com\/api\/timedtext\?(.*)subtype=(Official|External) url script-response-body https://raw.githubusercontent.com/woziji159/Quantunmult/refs/heads/main/ext-subs-universal-composite.subtitles.response.js
# 🍿️ DualSubs.YouTube.Translate.TimedText.response
^https?:\/\/(www|m)\.youtube\.com\/api\/timedtext\?(.*)subtype=Translate url script-response-body https://raw.githubusercontent.com/woziji159/Quantunmult/refs/heads/main/ext-subs-universal-translate.response.js

