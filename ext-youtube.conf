^https?:\/\/music\.youtube\.com\/youtubei\/v1\/browse\?(.*)subtype=Translate url script-response-body https://raw.githubusercontent.com/woziji159/Quantunmult/refs/heads/main/ext-subs-universal-translate.response.js
