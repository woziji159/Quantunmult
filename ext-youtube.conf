hostname = dualsubs.github.io, www.youtube.com, m.youtube.com, tv.youtube.com, music.youtube.com, youtubei.googleapis.com, -redirector*.googlevideo.com, *.googlevideo.com

# Maasea background / PiP / ad removal; player and get_watch already use the combined handler above.
^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/(?:browse|next|search|reel\/reel_watch_sequence|guide|account\/get_setting|log_event|config)(?!\S*subtype=Translate)(?:\?.*)?$ url script-response-body https://raw.githubusercontent.com/woziji159/Quantunmult/refs/heads/main/ext-youtube-response.js
^https?:\/\/[\w-]+\.googlevideo\.com\/initplayback\S*&ack\S* url script-request-body https://raw.githubusercontent.com/woziji159/Quantunmult/refs/heads/main/ext-youtube-request.js
^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/log_event(?:\?.*)?$ url script-request-body https://raw.githubusercontent.com/woziji159/Quantunmult/refs/heads/main/ext-youtube-request.js
